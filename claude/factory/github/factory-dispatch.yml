# Factory dispatcher. Copy to .github/workflows/factory-dispatch.yml in the
# project (not in this repository). See factory/github/README.md for the
# runner, the variables and the risks.
#
# It never decides what to build: factory/scripts/next-issue.mjs picks the
# oldest open issue labelled `factory` and `ready`, marked ready by someone who
# can write to the repository, whose dependencies are all closed. Then a Claude
# Code session on the self-hosted runner runs the factory skill on it, and
# leaves the pull request open for a person to accept (`no-merge`), unless
# FACTORY_AUTO_MERGE is true and code found nothing a person must see.
#
# It reacts to issue events only, never to pull requests, so no code from a
# fork ever runs on the runner.
name: factory-dispatch

on:
  issues:
    types: [labeled, closed]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # a safety net: picks up anything an event missed

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

# One build at a time per repository. A newer pending run replaces an older
# pending one, which is harmless: every run picks the next issue afresh.
concurrency:
  group: factory-${{ github.repository }}
  cancel-in-progress: false

jobs:
  readiness:
    # A person just added `ready`: check the issue mechanically first, so a
    # ticket that is not ready loses the label at once instead of waiting.
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready'
    runs-on: [self-hosted, factory]
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_HOME: ${{ vars.FACTORY_HOME }}
    steps:
      - uses: actions/checkout@v4
      - name: Readiness check
        run: |
          home="${FACTORY_HOME:-$HOME/.claude/skills/factory}"
          n=${{ github.event.issue.number }}
          if ! out=$(node "$home/scripts/ready-check.mjs" "$n"); then
            printf 'The readiness check refused this issue, so `ready` was removed:\n\n%s\n\nFix the issue and add `ready` again.\n' "$out" > "$RUNNER_TEMP/ready.md"
            gh issue comment "$n" --body-file "$RUNNER_TEMP/ready.md"
            gh issue edit "$n" --remove-label ready
          fi

  build:
    needs: readiness
    # Runs after the readiness job, or on its own for the other events.
    if: always() && (needs.readiness.result == 'success' || needs.readiness.result == 'skipped')
    runs-on: [self-hosted, factory]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      FACTORY_HOME: ${{ vars.FACTORY_HOME }}
      FACTORY_AUTHORS: ${{ vars.FACTORY_AUTHORS }}
      FACTORY_CLAUDE_FLAGS: ${{ vars.FACTORY_CLAUDE_FLAGS || '--dangerously-skip-permissions --permission-mode bypassPermissions' }}
      FACTORY_AUTO_MERGE: ${{ vars.FACTORY_AUTO_MERGE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the next issue
        id: pick
        run: |
          home="${FACTORY_HOME:-$HOME/.claude/skills/factory}"
          node "$home/scripts/next-issue.mjs" --json | tee "$RUNNER_TEMP/pick.json"
          echo "issue=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).next ?? "")' "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
      - name: Build it
        if: steps.pick.outputs.issue != ''
        run: |
          set -euo pipefail
          n=${{ steps.pick.outputs.issue }}
          claude_flags="${FACTORY_CLAUDE_FLAGS:---dangerously-skip-permissions --permission-mode bypassPermissions}"
          home="${FACTORY_HOME:-$HOME/.claude/skills/factory}"
          node "$home/scripts/ready-check.mjs" "$n" || { gh issue edit "$n" --remove-label ready; exit 0; }
          gh issue edit "$n" --add-label factory-running
          git config user.name "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          merge="no-merge"
          [ "${FACTORY_AUTO_MERGE:-}" = "true" ] && merge="merge only when the workflow's merge decision is auto"
          prompt="Run the factory skill on issue #$n of this repository. This is an unattended run started by the dispatcher: $merge. Nobody can answer you during it. If the run is blocked with questions, post them on the issue as the skill says and swap ready for needs-info. If it fails or is blocked for another reason, comment the reason on the issue and add the label factory-failed. Then stop."
          # shellcheck disable=SC2086
          claude -p "$prompt" $claude_flags
      - name: Release the issue
        if: always() && steps.pick.outputs.issue != ''
        run: gh issue edit ${{ steps.pick.outputs.issue }} --remove-label factory-running || true
      - name: Look for the next one
        if: always() && steps.pick.outputs.issue != ''
        run: gh workflow run factory-dispatch.yml --ref "${{ github.event.repository.default_branch }}" || true
